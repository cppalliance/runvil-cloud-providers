[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/gateway-cloud-providers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSL-1.0"
repository = "https://github.com/cppalliance/runvil-cloud-providers"

[workspace.dependencies]
# Derives the committed JSON Schema of the model sheet from the serde types.
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes `from_str` reproduce the exact `f64` that
# `to_string` printed, so the previous sheet reads back bit-for-bit.
# `preserve_order` stays off: provider keys come from a `BTreeMap` and the
# emitted byte order is part of the artifact.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Validates the rendered sheet against the schema before it is written.
# default-features off: every reference in the schema is an internal
# `#/$defs/...`, so no file or HTTP resolver is compiled in.
jsonschema = { version = "0.60", default-features = false }
time = { version = "0.3", features = ["formatting"] }
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream", "system-proxy"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
build-ceiling = { path = "crates/build-ceiling" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Cherry-picked out of pedantic: it flags product names (OpenAI, Brave) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"
# Cherry-picked out of pedantic: its suggested rewrite for a collection is
# `assert_eq!(x, [] as [T; 0])`, which has to spell out the element type and
# needs `T: PartialEq + Debug`, so it cannot be applied to most call sites.
assert_is_empty = "allow"
